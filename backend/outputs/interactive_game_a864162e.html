<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCP握手序号大挑战 - 互动问答游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 800px;
            width: 100%;
            padding: 40px;
        }
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        .question {
            margin-bottom: 30px;
        }
        .question-text {
            font-size: 20px;
            color: #333;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .option {
            padding: 15px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 16px;
        }
        .option:hover {
            background: #f0f0f0;
            border-color: #667eea;
        }
        .option.correct {
            background: #4caf50;
            color: white;
            border-color: #4caf50;
        }
        .option.wrong {
            background: #f44336;
            color: white;
            border-color: #f44336;
        }
        .score {
            text-align: center;
            font-size: 24px;
            color: #667eea;
            margin-top: 30px;
            font-weight: bold;
        }
        .next-btn {
            display: block;
            margin: 30px auto 0;
            padding: 15px 40px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .next-btn:hover {
            background: #5568d3;
        }
        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>TCP握手序号大挑战</h1>
        <div id="quiz-container"></div>
        <div class="score hidden" id="score"></div>
    </div>

    <script>
        const questions = [{"question": "关于\"知识点1\"，以下说法正确的是？", "options": ["A. 知识点1是本课的重点内容", "B. 知识点1与实际应用密切相关", "C. 知识点1需要深入理解", "D. 以上都对"], "answer": 3}, {"question": "关于\"知识点2\"，以下说法正确的是？", "options": ["A. 知识点2是本课的重点内容", "B. 知识点2与实际应用密切相关", "C. 知识点2需要深入理解", "D. 以上都对"], "answer": 3}];
        let currentQuestion = 0;
        let score = 0;
        
        function loadQuestion() {
            const container = document.getElementById('quiz-container');
            const question = questions[currentQuestion];
            
            let html = `
                <div class="question">
                    <div class="question-text">第${currentQuestion + 1}题：${question.question}</div>
                    <div class="options">
            `;
            
            question.options.forEach((option, index) => {
                html += `<div class="option" onclick="checkAnswer(${index}, ${question.answer}, this)">${option}</div>`;
            });
            
            html += `
                    </div>
                </div>
            `;
            
            if (currentQuestion < questions.length - 1) {
                html += `<button class="next-btn hidden" onclick="nextQuestion()">下一题</button>`;
            } else {
                html += `<button class="next-btn hidden" onclick="showResult()">查看结果</button>`;
            }
            
            container.innerHTML = html;
        }
        
        function checkAnswer(selected, correct, element) {
            const options = document.querySelectorAll('.option');
            options.forEach(opt => opt.style.pointerEvents = 'none');
            
            if (selected === correct) {
                element.classList.add('correct');
                score++;
            } else {
                element.classList.add('wrong');
                options[correct].classList.add('correct');
            }
            
            document.querySelector('.next-btn').classList.remove('hidden');
        }
        
        function nextQuestion() {
            currentQuestion++;
            loadQuestion();
        }
        
        function showResult() {
            const container = document.getElementById('quiz-container');
            const scoreDiv = document.getElementById('score');
            
            container.innerHTML = `
                <div style="text-align: center; padding: 40px;">
                    <h2 style="font-size: 32px; color: #667eea; margin-bottom: 20px;">游戏结束！</h2>
                    <p style="font-size: 24px;">你的得分：<span style="color: #4caf50; font-weight: bold;">${score}/${questions.length}</span></p>
                    <button class="next-btn" onclick="location.reload()" style="margin-top: 30px;">再玩一次</button>
                </div>
            `;
        }
        
        // 加载第一题
        loadQuestion();
    </script>
</body>
</html>
